name: CI

# PRs build, test and deploy a preview; merging to main deploys production.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Public repo: old-site backups and exports contain member and customer data.
      - name: Fail if data files are tracked
        run: |
          FOUND=$(git ls-files | grep -iE '\.(sql|sql\.gz|wpress|zip|tar|tgz|gz|xlsx|xls|csv|tsv|json\.bak|env)$|(^|/)wp-config\.php$' \
            | grep -vxE 'docs/url-map\.csv' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Data files are tracked in this public repository:"
            echo "$FOUND" | sed 's/^/  /'
            exit 1
          fi

      # Bookings, forms and memberships live in separate systems (docs/decisions/0003).
      - name: Fail if server code is added
        run: |
          FOUND=$(git ls-files | grep -E '^(functions/|migrations/|wrangler\.(toml|json|jsonc)$)' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::This site is static only. Server code belongs in a separate system:"
            echo "$FOUND" | sed 's/^/  /'
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      alias_url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
      commit_url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      # Type-checks pages against pool.ts and the content schemas.
      - run: npm run check
      - run: npm run build

      # Skipped until the Pages project and secrets exist, and on PRs from forks.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wendwood-www --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # Only this job can write to the PR, and it never checks out or runs branch code.
  comment:
    needs: build
    if: github.event_name == 'pull_request' && needs.build.outputs.alias_url != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # One comment per PR, edited on each push. Values go through env, never inline in the script.
      - name: Comment preview link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          ALIAS_URL: ${{ needs.build.outputs.alias_url }}
          COMMIT_URL: ${{ needs.build.outputs.commit_url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MARKER='<!-- pages-preview -->'
          BODY=$(printf '%s\n**Preview:** %s\n\nThis commit (%s): %s\n' "$MARKER" "$ALIAS_URL" "${SHA:0:7}" "$COMMIT_URL")
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
