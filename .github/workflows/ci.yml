name: CI

# PRs build, test and deploy a preview; merging to main deploys production.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Public repo: old-site backups and exports contain member and customer data.
      - name: Fail if data files are tracked
        run: |
          FOUND=$(git ls-files | grep -iE '\.(sql|sql\.gz|wpress|zip|tar|tgz|gz|xlsx|xls|csv|tsv|json\.bak|env)$|(^|/)wp-config\.php$' \
            | grep -vxE 'docs/url-map\.csv' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Data files are tracked in this public repository:"
            echo "$FOUND" | sed 's/^/  /'
            exit 1
          fi

      # Bookings, forms and memberships live in separate systems (docs/decisions/0003).
      - name: Fail if server code is added
        run: |
          FOUND=$(git ls-files | grep -E '^(functions/|migrations/|wrangler\.(toml|json|jsonc)$)' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::This site is static only. Server code belongs in a separate system:"
            echo "$FOUND" | sed 's/^/  /'
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

      # Skipped until the Pages project and secrets exist, and on PRs from forks.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wendwood-www --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
